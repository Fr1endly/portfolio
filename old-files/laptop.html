<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }
        h1 {
            color: #333;
            margin-bottom: 16px;
        }
        p {
            color: #555;
        }
        button {
            background: #0078d7;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 16px;
        }
        button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Portfolio</h1>
        <p>This is a sample portfolio page. Click the button to see a greeting.</p>
        <button id="greetBtn">Say Hello</button>
        <p id="greeting"></p>
    </div>
    <script>
        document.getElementById('greetBtn').addEventListener('click', function() {
            document.getElementById('greeting').textContent = 'Hello, thanks for visiting my portfolio!';
        });
    </script>
</body>
</html>
